<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#080A10"/>
<title>GarageBudget — pilotage</title>
<style>
:root{
  --bg:#080A10; --surf:#0D1017; --raise:#131725; --line:#1D2231; --line2:#272E42;
  --tx:#E7E9F2; --tx2:#9AA3B8; --tx3:#646D82;
  --acc:#5B7CFA; --acc-s:rgba(91,124,250,.13);
  --ok:#3DD68C; --ok-s:rgba(61,214,140,.12);
  --warn:#F5A524; --warn-s:rgba(245,165,36,.11);
  --bad:#F4525B; --bad-s:rgba(244,82,91,.11);
  --proj:#A78BFA; --proj-s:rgba(167,139,250,.12);
  --dep:#FB923C; --dep-s:rgba(251,146,60,.12);
  --r:12px; --rs:9px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Fira Code",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
  background:var(--bg);color:var(--tx);font-size:13px;line-height:1.45;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit;color:inherit;background:none;transition:background .12s,border-color .12s,color .12s,transform .1s}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc);text-decoration:none}
input,select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);
  color:var(--tx);padding:9px 11px;font-size:13px;width:100%;outline:none;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date],input[type=time]{min-height:38px}
textarea{resize:vertical;min-height:64px;line-height:1.5}

.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:15px}
.lbl{display:block;font-size:11px;color:var(--tx2);margin-bottom:5px}
.hd{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--tx3)}
.hr{height:1px;background:var(--line);margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.stack{display:flex;flex-direction:column;gap:11px}
.flex{display:flex;align-items:center;gap:9px}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.sp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{padding:9px 14px;border-radius:var(--rs);font-size:12.5px;font-weight:600;background:var(--raise);color:var(--tx2);border:1px solid transparent}
.btn:hover{background:var(--line);color:var(--tx)}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-p:hover{background:#6b89ff;color:#fff}
.btn-ok{background:var(--ok-s);color:var(--ok);border-color:rgba(61,214,140,.28)}
.btn-ok:hover{background:rgba(61,214,140,.2);color:var(--ok)}
.btn-warn{background:var(--warn-s);color:var(--warn);border-color:rgba(245,165,36,.28)}
.btn-warn:hover{background:rgba(245,165,36,.2);color:var(--warn)}
.btn-bad{background:var(--bad-s);color:var(--bad);border-color:rgba(244,82,91,.26)}
.btn-bad:hover{background:rgba(244,82,91,.18);color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn-ico{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--raise);color:var(--tx2);flex-shrink:0}
.btn-ico:hover{background:var(--line);color:var(--tx)}
.btn-full{width:100%;justify-content:center;display:flex;align-items:center;gap:6px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.3,1)}

.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;transition:background .12s}
.item:hover{background:var(--raise)}
.item.on{background:var(--acc-s)}
.del{opacity:0;color:var(--bad);font-size:17px;padding:0 5px;line-height:1;flex-shrink:0}
.item:hover .del,.ln:hover .del{opacity:1}
@media(hover:none){.del{opacity:.6}}
.ln{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.ln:hover{background:var(--raise)}

table{width:100%;border-collapse:collapse}
th{padding:7px 9px;text-align:left;color:var(--tx3);font-weight:600;font-size:11px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--raise)}

#app{height:100dvh;display:flex}
#side{width:226px;background:#05070C;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#top{padding:11px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;min-height:56px;background:var(--bg)}
#content{flex:1;overflow-y:auto;padding:18px 20px 30px;scroll-behavior:smooth}
.nav-b{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--rs);font-size:12.5px;font-weight:500;color:var(--tx3);text-align:left;margin-bottom:1px}
.nav-b:hover{background:var(--raise);color:var(--tx2)}
.nav-b.on{background:var(--acc-s);color:#B9C6FF;font-weight:600}
.nav-b .ic{width:16px;text-align:center;flex-shrink:0;opacity:.9}
.nav-b .cnt{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--bad);color:#fff}
.sect{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:.05em;padding:8px 10px 4px;text-transform:uppercase}

.ov{position:fixed;inset:0;background:rgba(2,3,6,.78);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:20px;width:100%;max-width:530px;max-height:88dvh;overflow-y:auto;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:11px;font-size:12.5px;font-weight:600;z-index:500;display:none;max-width:90vw;text-align:center;border:1px solid}

#pal{position:fixed;inset:0;background:rgba(2,3,6,.7);backdrop-filter:blur(3px);z-index:400;display:none;padding-top:12vh;justify-content:center}
#pal.on{display:flex}
.pal-box{background:var(--surf);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:560px;height:fit-content;max-height:66vh;display:flex;flex-direction:column;overflow:hidden}
.pal-res{overflow-y:auto;padding:6px}
.pal-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px}
.pal-i.on{background:var(--acc-s)}

/* agenda */
.ev{display:flex;gap:11px;padding:10px 11px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surf);cursor:pointer;transition:border-color .12s,background .12s;align-items:flex-start}
.ev:hover{border-color:var(--line2);background:var(--raise)}
.ev.done{opacity:.42}
.ev.done .ev-t{text-decoration:line-through}
.ev-time{font-family:var(--mono);font-size:12px;font-weight:700;width:42px;flex-shrink:0;padding-top:1px}
.ev-t{font-size:13px;font-weight:600;line-height:1.3}
.ev-m{font-size:11.5px;color:var(--tx3);margin-top:2px}
.ev-bar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{font-size:10.5px;color:var(--tx3);text-align:center;padding:4px 0;font-weight:600}
.cal-d{min-height:74px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:var(--surf);cursor:pointer;transition:border-color .12s;display:flex;flex-direction:column;gap:2px}
.cal-d:hover{border-color:var(--line2)}
.cal-d.out{opacity:.3}
.cal-d.today{border-color:var(--acc);background:var(--acc-s)}
.cal-d.sel{border-color:var(--tx2)}
.cal-n{font-size:11.5px;font-weight:700;font-family:var(--mono)}
.cal-e{font-size:10px;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--raise);padding:3px;border-radius:10px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap}
.tab.on{background:var(--surf);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.3)}

.empty{padding:44px 20px;text-align:center;color:var(--tx3)}
.empty .ei{font-size:30px;margin-bottom:10px;opacity:.6}

.hero{background:linear-gradient(160deg,#101527 0%,var(--surf) 58%);border:1px solid var(--line2);border-radius:16px;padding:20px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}

#mnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(5,7,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:120;padding:5px 0 max(5px,env(safe-area-inset-bottom))}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;color:var(--tx3);flex:1;min-width:0}
.mb.on{color:#B9C6FF}
.mb .mi{font-size:17px;line-height:1}
.mb .ml{font-size:9.5px;font-weight:600}

@media(max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .22s cubic-bezier(.3,.8,.3,1);width:250px;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:190;display:none}
  #scrim.on{display:block}
  #top{padding:10px 13px;min-height:52px}
  #content{padding:13px 13px 84px}
  #mnav{display:flex}
  .g4,.g3{grid-template-columns:1fr 1fr}
  .gauto{grid-template-columns:1fr}
  .modal{max-width:100%;border-radius:16px;padding:17px}
  .hero{padding:16px}
}
@media(max-width:430px){
  .g2.tight{grid-template-columns:1fr}
  .cal-d{min-height:54px;padding:3px 4px}
}
#gate{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 700px at 50% -10%,#141a2e 0%,var(--bg) 60%)}
#gate.on{display:flex}
.gate-box{width:100%;max-width:392px;background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:26px 24px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.2,.9,.3,1)}
.gate-logo{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px}
.gate-sub{font-size:12.5px;color:var(--tx3);line-height:1.55;margin-bottom:19px}
.gate-msg{font-size:12.5px;line-height:1.55;padding:11px 13px;border-radius:9px;margin-bottom:14px}
.gate-foot{font-size:11px;color:var(--tx3);line-height:1.5;margin-top:15px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">Garage<span style="color:var(--acc)">Budget</span></div>
    <div class="gate-sub">Entre ton adresse e-mail : tu recevras un lien qui te connecte en un clic. Pas de mot de passe à retenir.</div>
    <div id="gate-msg"></div>
    <div id="gate-form">
      <label class="lbl">Adresse e-mail</label>
      <input id="gate-mail" type="email" autocomplete="email" inputmode="email" placeholder="toi@exemple.fr" style="margin-bottom:11px">
      <button class="btn btn-p btn-full" id="gate-btn" onclick="sendMagic()">Recevoir mon lien de connexion</button>
    </div>
    <div class="gate-foot">Tes données restent dans ta base Supabase. Ce lien sert uniquement à prouver que c'est bien toi.</div>
  </div>
</div>
<div id="app" style="display:none">
  <aside id="side">
    <div style="padding:15px 13px 11px;border-bottom:1px solid var(--line)">
      <div style="font-size:14.5px;font-weight:700;letter-spacing:-.01em">Garage<span style="color:var(--acc)">Budget</span></div>
      <button id="synb" onclick="syncNow()" style="display:flex;align-items:center;gap:6px;margin-top:5px;padding:0">
        <span id="sdot" class="dot" style="background:var(--warn)"></span>
        <span id="stxt" style="font-size:11px;color:var(--tx3)">Chargement</span>
      </button>
    </div>
    <div id="nav" style="padding:7px 7px 3px"></div>
    <div class="hr" style="margin:2px 12px"></div>
    <div id="sbstock" style="flex:1;overflow-y:auto;padding:2px 6px"></div>
    <div style="padding:8px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line)">
      <button class="btn btn-p btn-full" onclick="openModal('new')">Ajouter un véhicule</button>
      <button class="btn btn-full btn-sm" onclick="openModal('event')">Planifier un rendez-vous</button>
    </div>
  </aside>
  <div id="scrim" onclick="toggleSide()"></div>
  <main id="main">
    <div id="top"></div>
    <div id="content"></div>
  </main>
</div>
<nav id="mnav"></nav>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="pal" onclick="if(event.target.id==='pal')closePal()">
  <div class="pal-box">
    <input id="pal-in" placeholder="Chercher un véhicule, une action, une page…" style="border:none;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:14px;background:transparent" autocomplete="off">
    <div class="pal-res" id="pal-res"></div>
  </div>
</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   1. STOCKAGE  (Supabase + localStorage)
   ══════════════════════════════════════════════════════════════ */
const DEF_SU="https://vyochassagwoddqtzfmh.supabase.co";
const DEF_SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5b2NoYXNzYWd3b2RkcXR6Zm1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTE0MzEsImV4cCI6MjA5MTE2NzQzMX0.BEHPn_QmhtFJEgwLAdwDFtbN8Gh2Z91njACye6lM-6I";
let SU=DEF_SU, SK=DEF_SK, connCustom=false;
try{const c=JSON.parse(localStorage.getItem("gb_conn")||"null");
  if(c&&c.url&&c.key){SU=c.url.replace(/\/+$/,"");SK=c.key;connCustom=true;}}catch{}
const SH=()=>({"Content-Type":"application/json",apikey:SK,
  Authorization:"Bearer "+(AUTH.token||SK)});

/* ── Authentification par lien e-mail (Supabase Auth) ─────────────────── */
const AUTH={token:null,refresh:null,exp:0,email:"",id:""};
const AK="gb_auth";
const authed=()=>!!AUTH.token&&Date.now()<AUTH.exp;
const appURL=()=>(location.origin&&location.origin!=="null")
  ?location.origin+location.pathname
  :location.href.split("#")[0].split("?")[0];
function authSave(){try{localStorage.setItem(AK,JSON.stringify({refresh:AUTH.refresh,email:AUTH.email}));}catch{}}
function authLoad(){try{const a=JSON.parse(localStorage.getItem(AK)||"null");
  if(a){AUTH.refresh=a.refresh||null;AUTH.email=a.email||"";}}catch{}}
function authClear(){AUTH.token=null;AUTH.refresh=null;AUTH.exp=0;AUTH.id="";
  try{localStorage.removeItem(AK);}catch{}}
function setSession(j){
  if(!j||!j.access_token)return false;
  AUTH.token=j.access_token;
  if(j.refresh_token)AUTH.refresh=j.refresh_token;
  AUTH.exp=Date.now()+((+j.expires_in||3600)-120)*1000;
  if(j.user){AUTH.email=j.user.email||AUTH.email;AUTH.id=j.user.id||AUTH.id;}
  authSave();return true;
}
async function authRefresh(){
  if(!AUTH.refresh)return false;
  try{
    const r=await fetch(SU+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
      headers:{"Content-Type":"application/json",apikey:SK},
      body:JSON.stringify({refresh_token:AUTH.refresh})});
    if(!r.ok){authClear();return false;}
    return setSession(await r.json());
  }catch{return false;}
}
async function authReady(){return authed()?true:await authRefresh();}
async function fetchUser(){
  try{
    const r=await fetch(SU+"/auth/v1/user",{headers:{apikey:SK,Authorization:"Bearer "+AUTH.token}});
    if(!r.ok)return;
    const u=await r.json();
    AUTH.email=u.email||AUTH.email;AUTH.id=u.id||AUTH.id;authSave();
  }catch{}
}
/* Toute requête à la base passe par ici : jeton rafraîchi, réessai unique sur 401. */
async function sb(path,opt={}){
  await authReady();
  const go=()=>fetch(SU+path,{...opt,headers:{...SH(),...(opt.headers||{})}});
  let r=await go();
  if(r.status===401&&AUTH.refresh&&await authRefresh())r=await go();
  if(r.status===401)gateOut("Ta session a expiré. Reconnecte-toi.");
  return r;
}

/* ── Écran de connexion ───────────────────────────────────────────────── */
function gateMsg(txt,kind){
  const e=g("gate-msg");if(!e)return;
  if(!txt){e.innerHTML="";return;}
  const c=kind==="err"?["var(--bad-s)","rgba(244,82,91,.3)","var(--bad)"]
    :kind==="ok"?["var(--ok-s)","rgba(61,214,140,.3)","var(--ok)"]
    :["var(--raise)","var(--line)","var(--tx2)"];
  e.innerHTML=`<div class="gate-msg" style="background:${c[0]};border:1px solid ${c[1]};color:${c[2]}">${esc(txt)}</div>`;
}
function showGate(msg,kind){
  g("gate").classList.add("on");g("app").style.display="none";
  const m=g("gate-mail");if(m&&AUTH.email)m.value=AUTH.email;
  if(msg)gateMsg(msg,kind||"err");
  setTimeout(()=>{const i=g("gate-mail");if(i&&!i.value)i.focus();},60);
}
function gateOut(msg){authClear();showGate(msg,"err");}
function showApp(){g("gate").classList.remove("on");g("app").style.display="flex";}
let magicBusy=false;
async function sendMagic(){
  if(magicBusy)return;
  const mail=(gv("gate-mail")||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(mail))return gateMsg("Cette adresse ne ressemble pas à un e-mail.","err");
  magicBusy=true;
  const b=g("gate-btn");if(b){b.textContent="Envoi…";b.disabled=true;}
  AUTH.email=mail;authSave();
  try{
    const r=await fetch(SU+"/auth/v1/otp?redirect_to="+encodeURIComponent(appURL()),{method:"POST",
      headers:{"Content-Type":"application/json",apikey:SK},
      body:JSON.stringify({email:mail,create_user:true,gotrue_meta_security:{}})});
    if(r.ok){
      gateMsg("Lien envoyé à "+mail+". Ouvre-le depuis cet appareil ; il expire dans une heure. Pense à regarder tes indésirables.","ok");
    }else{
      let m="";try{const j=await r.json();m=j.msg||j.message||j.error_description||"";}catch{}
      if(r.status===429)gateMsg("Trop de demandes. Attends quelques minutes avant de réessayer.","err");
      else if(/signup|not allowed|disabled/i.test(m))gateMsg("Cette adresse n'a pas accès à l'application.","err");
      else gateMsg("Envoi impossible"+(m?" — "+m:"")+".","err");
    }

/* Diagnostic : teste la lecture ET l'écriture, table par table. */
let connDiag=null, connBusy=false;
async function probe(table){
  const P="__gb_probe__";
  let r;
  try{r=await sb("/rest/v1/"+table+"?select=id&limit=1");}
  catch{return{table,lvl:"bad",msg:"Adresse injoignable",fix:"url"};}
  if(r.status===401||r.status===403){
    let code="";try{code=(await r.json()).message||"";}catch{}
    return{table,lvl:"bad",msg:(authed()?"Accès refusé à cette table":"Session expirée")+(code?" — "+code.slice(0,60):""),fix:"key"};
  }
  if(r.status===404)return{table,lvl:"bad",msg:"Table absente",fix:"sql"};
  if(!r.ok)return{table,lvl:"bad",msg:"Erreur "+r.status,fix:"sql"};
  try{
    const w=await sb("/rest/v1/"+table,{method:"POST",
      headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify([{id:P,data:{probe:true}}])});
    if(w.status===401||w.status===403)return{table,lvl:"warn",msg:"Lecture seule — règle d'accès manquante",fix:"sql"};
    if(!w.ok&&w.status!==409)return{table,lvl:"warn",msg:"Écriture refusée ("+w.status+")",fix:"sql"};
    await sb("/rest/v1/"+table+"?id=eq."+P,{method:"DELETE"});
  }catch{return{table,lvl:"warn",msg:"Écriture non vérifiable",fix:"sql"};}
  return{table,lvl:"ok",msg:"Lecture et écriture fonctionnelles"};
}

function pStat(p){
  const ex=p.expenses||[];
  const rep=ex.reduce((s,e)=>s+(+e.amount||0),0);
  const repPaid=ex.filter(e=>e.paid!==false).reduce((s,e)=>s+(+e.amount||0),0);
  const repPrev=ex.filter(e=>e.paid===false).reduce((s,e)=>s+(+e.amount||0),0);
  if(p.projectType==="depot_vente"){
    const com=p.commission||0;
    return{rep,repPaid,repPrev,invested:repPaid,investedTotal:rep,buy:0,com,
      sr:p.saleRealPrice||0,se:p.saleEstPrice||0,
      profitR:p.status==="vendu"?com-repPaid:0,profitE:com-rep,
      mgR:0,mgE:0,roi:com>0?(com-rep)/com*100:0,isD:true};
  }
  const buy=p.buyPrice||0;
  const invested=buy+repPaid, investedTotal=buy+rep;
  const se=p.saleEstPrice||0, sr=p.saleRealPrice||0;
  const profitR=p.status==="vendu"&&sr>0?sr-invested:0;
  const profitE=se>0?se-investedTotal:0;
  const roi=invested>0&&sr>0?(sr-invested)/invested*100:(investedTotal>0&&se>0?(se-investedTotal)/investedTotal*100:0);
  return{rep,repPaid,repPrev,invested,investedTotal,buy,com:0,sr,se,profitR,profitE,
    mgR:invested>0?profitR/invested*100:0,mgE:investedTotal>0?profitE/investedTotal*100:0,roi,isD:false};
}
function priorityScore(p){
  const s=pStat(p), d=dSince(p.entryDate)||0;
  let sc=0;
  if(s.repPrev<300)sc+=3;
  if(s.profitE>500)sc+=2;
  if(d>15)sc+=2;
  if(s.repPrev>1500)sc-=2;
  return sc;
}

}
function calcTreso(){
  const base=S.settings.tresoManuelle||0;
  const inj=(S.caps||[]).reduce((s,i)=>s+(+i.amount||0),0);
  const sold=S.projects.filter(p=>p.status==="vendu");
  const active=S.projects.filter(p=>!["vendu","annule","previsionnel"].includes(p.status));
  const activeNoPause=active.filter(p=>p.status!=="pause");
  const paused=active.filter(p=>p.status==="pause");
  const prev=S.projects.filter(p=>p.status==="previsionnel");

  const ventesAchat=sold.filter(p=>p.projectType!=="depot_vente").reduce((s,p)=>s+(p.montantEncaisse||p.saleRealPrice||0),0);
  const commissions=sold.filter(p=>p.projectType==="depot_vente").reduce((s,p)=>s+(p.commission||0),0);
  const achatsPaids=S.projects.filter(p=>p.projectType!=="depot_vente"&&!["annule","previsionnel"].includes(p.status)).reduce((s,p)=>s+(p.buyPrice||0),0);
  const fraisPayes=S.projects.filter(p=>!["annule","previsionnel"].includes(p.status)).reduce((s,p)=>s+pStat(p).repPaid,0);
  const depPerso=(S.perso||[]).reduce((s,e)=>s+(+e.amount||0),0);
  const tresoReelle=base+inj+ventesAchat+commissions-achatsPaids-fraisPayes-depPerso;

  const fraisPrevusActif=activeNoPause.reduce((s,p)=>s+pStat(p).repPrev,0);
  const fraisPrevusPrev=prev.reduce((s,p)=>s+pStat(p).rep,0);
  const fraisPrevus=fraisPrevusActif+fraisPrevusPrev;
  const achatsPrev=prev.reduce((s,p)=>s+(p.buyPrice||0),0);
  const tresoDisponible=tresoReelle-fraisPrevusActif;
  const tresoFinaleEst=tresoReelle-fraisPrevus-achatsPrev;

  const immo=list=>list.filter(p=>p.projectType!=="depot_vente").reduce((s,p)=>s+(p.buyPrice||0),0)+list.reduce((s,p)=>s+pStat(p).repPaid,0);
  const cashImmo=immo(active), cashImmoNoPause=immo(activeNoPause), cashImmoPause=immo(paused);
  const aRentrer=activeNoPause.reduce((s,p)=>{const st=pStat(p);return st.se>0?s+st.se:s;},0);

  return{base,inj,ventesAchat,commissions,achatsPaids,fraisPayes,depPerso,tresoReelle,
    fraisPrevus,fraisPrevusActif,fraisPrevusPrev,achatsPrev,tresoDisponible,tresoFinaleEst,
    cashImmo,cashImmoNoPause,cashImmoPause,aRentrer,active,activeNoPause,paused,prev,sold};
}

  if(t.tresoDisponible<0)out.push({lvl:"bad",icon:"⚠️",txt:"Trésorerie disponible négative",
    sub:`${fmt(t.tresoDisponible)} une fois les frais prévus réglés`,act:{label:"Trésorerie",fn:`setView('treso')`}});
  evOpenPast().forEach(e=>out.push({lvl:"warn",icon:EVT[e.type]?.icon||"📌",
    txt:`${e.title} — ${relDay(e.date)}`,sub:"Rendez-vous passé non clôturé",
    act:{label:"Marquer fait",fn:`toggleEvent('${e.id}')`}}));
  const order={bad:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}

/* Export ICS — fonctionne partout, même sans compte Google connecté. */
function icsDate(e){
  const d=e.date.replace(/-/g,"");
  if(!e.time)return{all:true,start:d,end:d.slice(0,4)+d.slice(4,6)+d.slice(6,8)};
  const st=new Date(e.date+"T"+e.time+":00");
  const en=new Date(st.getTime()+(e.duration||60)*6e4);
  const f=x=>x.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  return{all:false,start:f(st),end:f(en)};
}
function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");}
function buildICS(list){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GarageBudget//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:GarageBudget"];
  list.forEach(e=>{
    const d=icsDate(e), p=e.projectId?proj(e.projectId):null;
    L.push("BEGIN:VEVENT","UID:"+e.id+"@garagebudget",
      "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
      d.all?"DTSTART;VALUE=DATE:"+d.start:"DTSTART:"+d.start,
      d.all?"DTEND;VALUE=DATE:"+addDays(e.date,1).replace(/-/g,""):"DTEND:"+d.end,
      "SUMMARY:"+icsEscape((EVT[e.type]?.icon||"")+" "+e.title),
      "DESCRIPTION:"+icsEscape([p?"Véhicule : "+pName(p):"",e.contact?"Contact : "+e.contact:"",e.phone?"Tél : "+e.phone:"",e.notes||""].filter(Boolean).join("\n")),
      e.place?"LOCATION:"+icsEscape(e.place):"","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.filter(Boolean).join("\r\n");
}
function exportICS(){
  const list=evList().filter(e=>e.src!=="gcal");
  if(!list.length)return showToast("Aucun rendez-vous à exporter","err");
  dl(new Blob([buildICS(list)],{type:"text/calendar"}),"garagebudget-agenda.ics");
  showToast(list.length+" rendez-vous exportés");
}
function gcalLink(e){
  const d=icsDate(e), p=e.projectId?proj(e.projectId):null;
  const dates=d.all?`${d.start}/${addDays(e.date,1).replace(/-/g,"")}`:`${d.start}/${d.end}`;
  const det=[p?"Véhicule : "+pName(p):"",e.contact?"Contact : "+e.contact:"",e.phone||"",e.notes||""].filter(Boolean).join("\n");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent((EVT[e.type]?.icon||"")+" "+e.title)
    +"&dates="+dates+"&details="+encodeURIComponent(det)
    +(e.place?"&location="+encodeURIComponent(e.place):"");
}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
/* ══════════════════════════════════════════════════════════════
   7. GOOGLE AGENDA — connexion OAuth + synchronisation
   ══════════════════════════════════════════════════════════════ */
const GC={token:null,exp:0,client:null,busy:false,last:null};
const GSCOPE="https://www.googleapis.com/auth/calendar.events";

function gcalReady(){return !!(S.settings.gcalClientId||"").trim();}
function gcalConnected(){return !!GC.token&&Date.now()<GC.exp;}
function gcalCalId(){return encodeURIComponent(S.settings.gcalCalendarId||"primary");}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`))return res();
    const s=document.createElement("script");
    s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error("script"));
    document.head.appendChild(s);
  });
}
function restoreToken(){
  try{const r=JSON.parse(sessionStorage.getItem("gb_gtok")||"null");
    if(r&&r.exp>Date.now()+3e4){GC.token=r.token;GC.exp=r.exp;}}catch{}
}
async function gcalConnect(silent){
  if(!gcalReady()){if(!silent)showToast("Renseigne d'abord l'identifiant Google","err");return false;}
  if(gcalConnected())return true;
  try{await loadScript("https://accounts.google.com/gsi/client");}
  catch{if(!silent)showToast("Impossible de charger Google (hors ligne ?)","err");return false;}
  if(!window.google?.accounts?.oauth2){if(!silent)showToast("Google indisponible","err");return false;}
  return new Promise(res=>{
    try{
      GC.client=google.accounts.oauth2.initTokenClient({
        client_id:S.settings.gcalClientId.trim(),
        scope:GSCOPE,
        prompt:silent?"none":"",
        callback:r=>{
          if(r&&r.access_token){
            GC.token=r.access_token;
            GC.exp=Date.now()+((r.expires_in||3600)-90)*1000;
            sessionStorage.setItem("gb_gtok",JSON.stringify({token:GC.token,exp:GC.exp}));
            if(!silent)showToast("Google Agenda connecté");
            renderSyncChip();res(true);
          }else res(false);
        },
        error_callback:()=>{if(!silent)showToast("Connexion Google annulée","err");res(false);}
      });
      GC.client.requestAccessToken();
    }catch{res(false);}
  });
}
function gcalDisconnect(){
  GC.token=null;GC.exp=0;sessionStorage.removeItem("gb_gtok");
  showToast("Google Agenda déconnecté");render();
}
async function gapi(path,opt={}){
  const r=await fetch("https://www.googleapis.com/calendar/v3"+path,{
    ...opt,headers:{Authorization:"Bearer "+GC.token,"Content-Type":"application/json",...(opt.headers||{})}});
  if(r.status===401){GC.token=null;GC.exp=0;throw new Error("auth");}
  if(!r.ok)throw new Error("api "+r.status);
  return r.status===204?null:r.json();
}
function toGoogle(e){
  const p=e.projectId?proj(e.projectId):null;
  const body={
    summary:(EVT[e.type]?.icon||"")+" "+e.title,
    description:[p?"Véhicule : "+pName(p):"",e.contact?"Contact : "+e.contact:"",
      e.phone?"Tél : "+e.phone:"",e.notes||"","— GarageBudget"].filter(Boolean).join("\n"),
    location:e.place||undefined,
    extendedProperties:{private:{gbId:e.id,gbType:e.type,gbProject:e.projectId||""}}
  };
  if(e.time){
    const st=new Date(e.date+"T"+e.time+":00");
    const en=new Date(st.getTime()+(e.duration||60)*6e4);
    body.start={dateTime:st.toISOString()};body.end={dateTime:en.toISOString()};
  }else{
    body.start={date:e.date};body.end={date:addDays(e.date,1)};
  }
  return body;
}
function fromGoogle(ge){
  const pv=ge.extendedProperties?.private||{};
  const dt=ge.start?.dateTime||null;
  return{
    id:pv.gbId||"g_"+ge.id,
    gcalId:ge.id,
    src:pv.gbId?"local":"gcal",
    title:(ge.summary||"(sans titre)").replace(/^[^\w\dÀ-ÿ]+\s*/,"").trim()||"(sans titre)",
    type:pv.gbType||"admin",
    projectId:pv.gbProject||null,
    date:dt?dt.slice(0,10):(ge.start?.date||today()),
    time:dt?dt.slice(11,16):"",
    duration:dt&&ge.end?.dateTime?Math.max(15,Math.round((new Date(ge.end.dateTime)-new Date(dt))/6e4)):60,
    place:ge.location||"",notes:"",contact:"",phone:"",done:false,
    updated:ge.updated||""
  };
}
/* Synchronisation : envoi des rendez-vous locaux, puis récupération de Google. */
async function gcalSync(silent){
  if(!gcalReady())return;
  if(GC.busy)return;
  if(!gcalConnected()){const ok=await gcalConnect(silent);if(!ok)return;}
  GC.busy=true;renderSyncChip();
  let pushed=0,pulled=0;
  try{
    const cal=gcalCalId();
    for(const e of S.events.filter(x=>x.src!=="gcal"&&!x.noSync)){
      try{
        if(e.gcalId){
          if(e._dirty){await gapi(`/calendars/${cal}/events/${e.gcalId}`,{method:"PATCH",body:JSON.stringify(toGoogle(e))});delete e._dirty;pushed++;}
        }else{
          const r=await gapi(`/calendars/${cal}/events`,{method:"POST",body:JSON.stringify(toGoogle(e))});
          e.gcalId=r.id;delete e._dirty;pushed++;
        }
      }catch(err){if(err.message==="auth")throw err;}
    }
    for(const id of (S._gcalTrash||[])){
      try{await gapi(`/calendars/${cal}/events/${id}`,{method:"DELETE"});}catch{}
    }
    S._gcalTrash=[];
    const tmin=new Date(Date.now()-45*864e5).toISOString();
    const tmax=new Date(Date.now()+180*864e5).toISOString();
    const r=await gapi(`/calendars/${cal}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tmin)}&timeMax=${encodeURIComponent(tmax)}`);
    const remote=(r.items||[]).filter(x=>x.status!=="cancelled").map(fromGoogle);
    const byGid=new Map(S.events.filter(e=>e.gcalId).map(e=>[e.gcalId,e]));
    remote.forEach(re=>{
      const mine=byGid.get(re.gcalId);
      if(mine){
        if(!mine._dirty){Object.assign(mine,{date:re.date,time:re.time,duration:re.duration,place:re.place,title:re.title});}
      }else if(!S.events.some(e=>e.id===re.id)){
        S.events.push(re);pulled++;
      }
    });
    const alive=new Set(remote.map(x=>x.gcalId));
    S.events=S.events.filter(e=>e.src!=="gcal"||alive.has(e.gcalId));
    GC.last=new Date();
    save();render();
    if(!silent)showToast(`Google Agenda à jour — ${pushed} envoyé${pushed>1?"s":""}, ${pulled} importé${pulled>1?"s":""}`);
  }catch(err){
    if(!silent)showToast(err.message==="auth"?"Session Google expirée, reconnecte-toi":"Synchronisation Google impossible","err");
  }finally{GC.busy=false;renderSyncChip();}
}
async function gcalDelete(e){
  if(!e.gcalId)return;
  S._gcalTrash=[...(S._gcalTrash||[]),e.gcalId];
  if(gcalConnected()){
    try{await gapi(`/calendars/${gcalCalId()}/events/${e.gcalId}`,{method:"DELETE"});
      S._gcalTrash=S._gcalTrash.filter(x=>x!==e.gcalId);}catch{}
  }
}

   8. PERSISTANCE
   ══════════════════════════════════════════════════════════════ */
const LS="gb_v10";
let syncTimer=null, syncState="loading";
function setSync(st){syncState=st;renderSyncChip();}
function renderSyncChip(){
  const d=g("sdot"),t=g("stxt");if(!d||!t)return;
  const map={ok:["var(--ok)","Synchronisé"],err:["var(--bad)","Hors ligne"],loading:["var(--warn)","Enregistrement…"]};
  const[c,l]=map[syncState]||map.loading;
  d.style.background=c;
  t.textContent=GC.busy?"Google…":(gcalConnected()?l+" · Google":l);
  t.style.color="var(--tx3)";
}
function save(){
  S._dirty=true;
  try{
    localStorage.setItem(LS,JSON.stringify({projects:S.projects,perso:S.perso,caps:S.caps,events:S.events,
      settings:S.settings,meta:S.meta,trash:S._gcalTrash||[]}));
  }catch{}
  if(syncTimer)clearTimeout(syncTimer);
  setSync("loading");
  syncTimer=setTimeout(()=>{syncTimer=null;pushRemote();},1400);
}
async function pushRemote(){
  try{
    const jobs=[dbUpsert("settings",[{id:"main",data:S.settings,updated_at:new Date().toISOString()}])];
    if(S.projects.length)jobs.push(dbUpsert("projects",S.projects.map(p=>({id:p.id,data:p,updated_at:new Date().toISOString()}))));
    if(S.perso.length)jobs.push(dbUpsert("perso_expenses",S.perso.map(e=>({id:e.id,data:e}))));
    if(S.caps.length)jobs.push(dbUpsert("capital_injections",S.caps.map(c=>({id:c.id,data:c}))));
    const local=S.events.filter(e=>e.src!=="gcal");
    if(local.length)jobs.push(dbUpsert("events",local.map(e=>({id:e.id,data:e,updated_at:new Date().toISOString()}))));
    const r=await Promise.all(jobs);
    const ok=r.every(Boolean);
    if(ok)S._dirty=false;
    setSync(ok?"ok":"err");
    return ok;
  }catch{setSync("err");return false;}
}
function syncNow(){
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
  setSync("loading");
  pushRemote().then(ok=>{
    showToast(ok?"Données enregistrées en ligne":"Le serveur n'a pas répondu — tout reste sur cet appareil",ok?"ok":"err");
    if(ok&&gcalReady())gcalSync(false);
  });
}

function loadLocal(){
  try{
    const raw=localStorage.getItem(LS)||localStorage.getItem("gbv8");
    if(!raw)return false;
    const d=JSON.parse(raw);
    S.projects=d.projects||[];S.perso=d.perso||[];S.caps=d.caps||[];S.events=d.events||[];
    if(d.settings)S.settings={...DEF_SET,...d.settings};
    if(d.meta)S.meta={...S.meta,...d.meta};
    S._gcalTrash=d.trash||[];
    const s2=localStorage.getItem("gbv8s");
    if(s2&&!d.settings)S.settings={...S.settings,...JSON.parse(s2)};
    return true;
  }catch{return false;}
}
/* Fusionne une liste distante avec la liste locale, sans rien perdre :
   ce qui existe des deux côtés vient du serveur, ce qui n'existe qu'ici est conservé
   puis renvoyé au prochain enregistrement. */
function mergeById(remote,local){
  const out=remote.slice(), seen=new Set(remote.map(x=>x&&x.id));
  local.forEach(x=>{if(x&&!seen.has(x.id))out.push(x);});
  return out;
}
let lastPull=0;
async function pullRemote(){
  try{
    const[pr,pe,se,ca,ev]=await Promise.all([dbGet("projects"),dbGet("perso_expenses"),
      dbGet("settings"),dbGet("capital_injections"),dbGet("events")]);
    if(pr===null)return false;                      /* serveur injoignable ou table absente */
    const R=rows=>(rows||[]).map(r=>r.data||r);
    S.projects=mergeById(R(pr),S.projects);
    if(pe!==null)S.perso=mergeById(R(pe),S.perso);
    if(ca!==null)S.caps=mergeById(R(ca),S.caps);
    if(ev!==null)S.events=mergeById(R(ev),S.events);
    if(se&&se.length&&se[0].data)S.settings={...S.settings,...se[0].data};
    S.projects.forEach(p=>{p.expenses=p.expenses||[];p.timeEntries=p.timeEntries||[];});
    /* Ce qui vient du serveur est déjà à jour : inutile de le renvoyer. */
    _mark("projects",(pr||[]).map(r=>({id:r.id,data:r.data||r})));
    if(pe)_mark("perso_expenses",pe.map(r=>({id:r.id,data:r.data||r})));
    if(ca)_mark("capital_injections",ca.map(r=>({id:r.id,data:r.data||r})));
    if(ev)_mark("events",ev.map(r=>({id:r.id,data:r.data||r})));
    lastPull=Date.now();
    return true;
  }catch{return false;}
}
async function loadAll(){
  setSync("loading");
  loadLocal();
  S.projects.forEach(p=>{p.expenses=p.expenses||[];p.timeEntries=p.timeEntries||[];});
  render();
  const before=JSON.stringify([S.projects,S.perso,S.caps,S.events.filter(e=>e.src!=="gcal")]);
  const ok=await pullRemote();
  setSync(ok?"ok":"err");
  streakTick();
  render();
  /* Des données locales que le serveur ne connaît pas encore ? On les lui envoie. */
  if(ok&&JSON.stringify([S.projects,S.perso,S.caps,S.events.filter(e=>e.src!=="gcal")])!==before)save();
  if(S.settings.gcalAuto&&gcalReady()){restoreToken();gcalConnect(true).then(g=>{if(g)gcalSync(true);});}
}

function streakTick(){
  const t=today(), m=S.meta;
  if(m.lastOpen===t)return;
  const gap=m.lastOpen?dBetween(m.lastOpen,t):null;
  m.streak=gap===1?(m.streak||0)+1:1;
  m.best=Math.max(m.best||0,m.streak);
  m.lastOpen=t;m.opens=(m.opens||0)+1;
  save();
}

let toastT=null;
function showToast(msg,type){
  const el=g("toast");
  const ok=type!=="err";
  el.textContent=msg;
  el.style.display="block";
  el.style.background=ok?"#06231A":"#2A0E11";
  el.style.color=ok?"var(--ok)":"var(--bad)";
  el.style.borderColor=ok?"rgba(61,214,140,.4)":"rgba(244,82,91,.4)";
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(()=>el.style.display="none",2600);
}

/* helpers d'affichage */
function kpi(label,value,color,sub,onclick){
  return`<div class="card pad"${onclick?` style="cursor:pointer" onclick="${onclick}"`:""}>
    <div style="font-size:11.5px;color:var(--tx2)">${label}</div>
    <div class="n" style="font-size:21px;font-weight:700;color:${color||"var(--tx)"};margin-top:4px;letter-spacing:-.02em">${value}</div>
    ${sub?`<div style="font-size:11px;color:var(--tx3);margin-top:3px">${sub}</div>`:""}
  </div>`;
}
function mini(label,value,color){
  return`<div style="background:var(--raise);border-radius:8px;padding:8px 10px">
    <div style="font-size:10.5px;color:var(--tx3)">${label}</div>
    <div class="n" style="font-size:12.5px;font-weight:600;color:${color||"var(--tx)"};margin-top:1px">${value}</div>
  </div>`;
}
function chip(txt,color,bg){return`<span class="chip" style="background:${bg};color:${color}">${txt}</span>`;}
function ring(pct,size,color,label,sub){
  const r=(size-10)/2, c=2*Math.PI*r, off=c*(1-clamp(pct,0,1));
  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg class="ring" width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="7"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)"></circle>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="n" style="font-size:${size>90?16:13}px;font-weight:700;color:${color}">${label}</div>
      ${sub?`<div style="font-size:9.5px;color:var(--tx3)">${sub}</div>`:""}
    </div>
  </div>`;
}
function evRow(e,opts={}){
  const t=EVT[e.type]||EVT.admin, p=e.projectId?proj(e.projectId):null;
  const late=!e.done&&e.date<today();
  return`<div class="ev${e.done?" done":""}" data-ev="${e.id}">
    <div class="ev-bar" style="background:${late?"var(--bad)":t.color}"></div>
    <div class="ev-time" style="color:${late?"var(--bad)":"var(--tx2)"}">${e.time||"—"}</div>
    <div style="flex:1;min-width:0">
      <div class="ev-t">${t.icon} ${esc(e.title)}</div>
      <div class="ev-m el">${[opts.showDate?relDay(e.date):"",p?esc(pName(p)):"",e.place?esc(e.place):"",e.contact?esc(e.contact):""].filter(Boolean).join(" · ")||t.label}</div>
    </div>
    ${e.phone?`<a data-stop href="tel:${esc(e.phone)}" class="btn-ico" style="text-decoration:none" title="Appeler">✆</a>`:""}
    ${e.src!=="gcal"?`<button data-stop data-evdone="${e.id}" class="btn-ico" title="${e.done?"Rouvrir":"Marquer comme fait"}" style="color:${e.done?"var(--ok)":"var(--tx3)"}">✓</button>`:`<span class="chip" style="background:var(--raise);color:var(--tx3)">Google</span>`}
  </div>`;
}

  h+=`<div style="display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start" class="today-grid">`;

    :`<div style="padding:18px 0;text-align:center;color:var(--tx3);font-size:12.5px">Aucun rendez-vous aujourd'hui.</div>`;
  if(evTom.length){
    h+=`<div class="hr"></div><div style="font-size:11.5px;color:var(--tx2);margin-bottom:7px">Demain</div>
        <div class="stack" style="gap:7px">${evTom.slice(0,3).map(e=>evRow(e)).join("")}</div>`;

  h+=`</div></div>`;

/* ══════════════════════════════════════════════════════════════
   12. VUE — AGENDA
   ══════════════════════════════════════════════════════════════ */
function agMove(n){
  S.anchor=S.agendaMode==="mois"?shiftMonth(S.anchor,n):addDays(S.anchor,S.agendaMode==="semaine"?7*n:n);
  renderContent();
}
function shiftMonth(iso,n){const d=new Date(iso+"T12:00:00");d.setMonth(d.getMonth()+n,1);return d.toISOString().slice(0,10);}
function agToday(){S.anchor=today();renderContent();}
function agMode(m){S.agendaMode=m;renderContent();}
function agPick(iso){S.anchor=iso;if(S.agendaMode==="mois")S.agendaMode="jour";renderContent();}

function vAgenda(){
  const m=S.agendaMode;
  let title="";
  if(m==="jour")title=dLabel(S.anchor,true);
  else if(m==="semaine"){const a=mondayOf(S.anchor);title=`${dLabel(a)} – ${dLabel(addDays(a,6))}`;}
  else title=monthLabel(monthKey(S.anchor));

  let h=`<div class="sp" style="margin-bottom:13px;flex-wrap:wrap;gap:10px">
    <div class="flex" style="gap:7px">
      <button class="btn-ico" onclick="agMove(-1)" aria-label="Période précédente">‹</button>
      <button class="btn btn-sm" onclick="agToday()">Aujourd'hui</button>
      <button class="btn-ico" onclick="agMove(1)" aria-label="Période suivante">›</button>
      <div style="font-size:14px;font-weight:700;margin-left:6px;text-transform:capitalize">${title}</div>
    </div>
    <div class="flex" style="gap:8px">
      <div class="tabs">${[["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["liste","Liste"]].map(([k,l])=>
        `<button class="tab${m===k?" on":""}" onclick="agMode('${k}')">${l}</button>`).join("")}</div>
      <button class="btn btn-p btn-sm" onclick="openModal('event')">Planifier</button>
    </div>
  </div>`;

  h+=gcalPanel();

  if(m==="jour")h+=agDay(S.anchor);
  else if(m==="semaine")h+=agWeek();
  else if(m==="mois")h+=agMonth();
  else h+=agListe();
  return h;
}
function gcalPanel(){

      <div class="sp" style="flex-wrap:wrap;gap:10px">
        <div style="min-width:240px;flex:1">
          <div style="font-size:13px;font-weight:600">Relier Google Agenda</div>
          <div style="font-size:11.5px;color:var(--tx3);margin-top:2px">Tes rendez-vous partent dans ton agenda Google et ceux de Google reviennent ici. À défaut, exporte un fichier .ics.</div>
        </div>
        <div class="wrap">
          <button class="btn btn-p btn-sm" onclick="setView('settings');setTimeout(()=>setTab('google'),0)">Configurer</button>
          <button class="btn btn-sm" onclick="exportICS()">Exporter .ics</button>
        </div>
      </div>
    </div>`;
  }
  const on=gcalConnected();
  return`<div class="card" style="margin-bottom:13px;padding:11px 14px;border-color:${on?"rgba(61,214,140,.25)":"var(--line2)"}">
    <div class="sp" style="flex-wrap:wrap;gap:9px">
      <div class="flex">
        <span class="dot" style="background:${GC.busy?"var(--warn)":on?"var(--ok)":"var(--tx3)"}"></span>

          <div style="font-size:11px;color:var(--tx3)">${GC.last?"Dernière synchro à "+GC.last.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"Calendrier : "+(S.settings.gcalCalendarId||"primary")}</div>
        </div>
      </div>
      <div class="wrap">
        <button class="btn btn-sm ${on?"btn-ok":"btn-p"}" onclick="gcalSync(false)">${on?"Synchroniser":"Se connecter"}</button>

        <button class="btn btn-sm" onclick="exportICS()">.ics</button>

function agDay(iso){
  const list=evOn(iso);
  const done=list.filter(e=>e.done).length;
  let h=`<div class="card pad">
    <div class="hd">${dLabel(iso,true)}<span class="mut" style="font-weight:400;font-size:11px">${list.length} rendez-vous${done?` · ${done} fait${done>1?"s":""}`:""}</span></div>`;
  h+=list.length?`<div class="stack" style="gap:8px">${list.map(e=>evRow(e)).join("")}</div>`
    :`<div class="empty"><div class="ei">▤</div>Journée libre.<div style="margin-top:12px"><button class="btn btn-p btn-sm" onclick="openModal('event',null,'${iso}')">Planifier quelque chose</button></div></div>`;
  h+=`</div>`;
  const t=calcTreso();
  const dueTod=t.active.flatMap(p=>(p.expenses||[]).filter(e=>e.paid===false&&e.date===iso).map(e=>({p,e})));
  if(dueTod.length){
    h+=`<div class="card pad" style="margin-top:12px"><div class="hd">Frais prévus ce jour-là</div>`;
    h+=dueTod.map(({p,e})=>`<div class="ln" data-p="${p.id}" style="cursor:pointer">
      <span>${cat(e.category).icon}</span>
      <div style="flex:1;min-width:0"><div class="el" style="font-size:12.5px">${esc(e.label)}</div>
      <div style="font-size:11px;color:var(--tx3)">${esc(pName(p))}</div></div>
      <span class="n" style="color:var(--warn);font-weight:600">${fmt(e.amount)}</span></div>`).join("");
    h+=`</div>`;
  }
  return h;
}
function agWeek(){
  const a=mondayOf(S.anchor), tod=today();
  let h=`<div class="card pad"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:9px" class="wk">`;
  for(let i=0;i<7;i++){
    const iso=addDays(a,i), list=evOn(iso), isTod=iso===tod;
    const d=new Date(iso+"T12:00:00");
    h+=`<div style="min-width:0">
      <button onclick="agPick('${iso}')" style="width:100%;text-align:left;padding:6px 8px;border-radius:8px;background:${isTod?"var(--acc-s)":"transparent"};margin-bottom:7px">
        <div style="font-size:11px;color:${isTod?"#B9C6FF":"var(--tx3)"}">${DAYS[i]}</div>
        <div class="n" style="font-size:17px;font-weight:700;color:${isTod?"#B9C6FF":"var(--tx)"}">${d.getDate()}</div>
      </button>
      <div class="stack" style="gap:5px">`;
    h+=list.length?list.map(e=>{
      const t=EVT[e.type]||EVT.admin;

function agMonth(){
  const k=monthKey(S.anchor), first=k+"-01", start=mondayOf(first), tod=today();
  let h=`<div class="card pad"><div class="cal" style="margin-bottom:5px">${DAYS.map(d=>`<div class="cal-h">${d}</div>`).join("")}</div><div class="cal">`;
  for(let i=0;i<42;i++){
    const iso=addDays(start,i), out=monthKey(iso)!==k, list=evOn(iso);
    if(i>=35&&out)continue;
    const sold=S.projects.filter(p=>p.status==="vendu"&&p.exitDate===iso);
    h+=`<div class="cal-d${out?" out":""}${iso===tod?" today":""}${iso===S.anchor?" sel":""}" onclick="agPick('${iso}')">
      <div class="sp"><span class="cal-n">${+iso.slice(8)}</span>${sold.length?`<span style="font-size:9px;color:var(--ok)">●</span>`:""}</div>`;
    list.slice(0,3).forEach(e=>{const t=EVT[e.type]||EVT.admin;
      h+=`<div class="cal-e" style="background:${t.color}22;color:${t.color};${e.done?"opacity:.5;text-decoration:line-through":""}">${e.time?e.time.slice(0,5)+" ":""}${esc(e.title)}</div>`;});
    if(list.length>3)h+=`<div style="font-size:9.5px;color:var(--tx3);padding-left:3px">+${list.length-3}</div>`;
    h+=`</div>`;
  }
  h+=`</div></div>`;
  const ms=monthStats(k);
  h+=`<div class="g3" style="margin-top:12px">
    ${kpi("Ventes du mois",ms.n,"var(--ok)",ms.n?fmt(ms.ca)+" encaissés":"aucune vente")}
    ${kpi("Marge du mois",fmt(ms.marge),ms.marge>=0?"var(--ok)":"var(--bad)","objectif "+fmt(S.settings.objectifMarge||0))}
    ${kpi("Rendez-vous",evBetween(k+"-01",k+"-31").length,"var(--acc)","dont "+evBetween(k+"-01",k+"-31").filter(e=>e.done).length+" faits")}
  </div>`;
  return h;
}
function agListe(){
  const from=addDays(today(),-7);
  const list=evList().filter(e=>e.date>=from);
  if(!list.length)return`<div class="card"><div class="empty"><div class="ei">▤</div>Aucun rendez-vous à venir.<div style="margin-top:12px"><button class="btn btn-p btn-sm" onclick="openModal('event')">Planifier</button></div></div></div>`;
  const by={};
  list.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e);});
  let h=`<div class="stack">`;
  Object.keys(by).sort().forEach(d=>{
    h+=`<div class="card pad">
      <div class="hd" style="text-transform:capitalize">${dLabel(d,true)}<span class="mut" style="font-weight:400;font-size:11px">${relDay(d)}</span></div>
      <div class="stack" style="gap:7px">${by[d].map(e=>evRow(e)).join("")}</div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function vStock(){
  const t=calcTreso();
  const sorted=[...t.activeNoPause].sort((a,b)=>priorityScore(b)-priorityScore(a));
  let h=`<div class="g3" style="margin-bottom:14px">
    ${kpi("Cash disponible",fmt(t.tresoDisponible),t.tresoDisponible>=0?"var(--ok)":"var(--bad)",t.fraisPrevus>0?fmt(t.fraisPrevus)+" de frais déjà engagés":"aucun frais en attente","setView('treso')")}
    ${kpi("Immobilisé",fmt(t.cashImmo),"#60A5FA",t.active.length+" véhicule"+(t.active.length>1?"s":"")+" en stock")}
    ${kpi("Marge potentielle",fmt(t.activeNoPause.reduce((s,p)=>s+Math.max(0,pStat(p).profitE),0)),"var(--proj)","si tout part au prix estimé")}
  </div>`;

  if(!t.active.length&&!t.prev.length){
    return h+`<div class="card"><div class="empty"><div class="ei">▦</div>
      <div style="font-size:14px;color:var(--tx2);margin-bottom:5px">Ton stock est vide.</div>
      <div style="font-size:12.5px">Ajoute un véhicule pour suivre son coût, sa marge et son temps en stock.</div>
      <div style="margin-top:14px"><button class="btn btn-p" onclick="openModal('new')">Ajouter un véhicule</button></div></div></div>`;
  }
  if(t.prev.length){
    h+=`<div class="hd" style="margin-bottom:9px">Prévisionnel — pas encore acheté<span class="mut" style="font-weight:400;font-size:11px">${fmt(t.achatsPrev)} à sortir</span></div><div class="gauto" style="margin-bottom:16px">`;
    t.prev.forEach(p=>{
      const s=pStat(p);
      h+=`<div class="card pad" style="border-color:rgba(167,139,250,.25);cursor:pointer" data-p="${p.id}">
        <div class="sp" style="margin-bottom:9px">
          <div class="el" style="font-size:13.5px;font-weight:700">${esc(pName(p))} <span class="mut" style="font-weight:400">${p.year||""}</span></div>
          ${chip("Prévisionnel","var(--proj)","var(--proj-s)")}
        </div>
        <div class="g2" style="gap:7px">
          ${mini("Achat prévu",fmt(p.buyPrice||0))}${mini("Marge estimée",s.se>0?fmt(s.profitE):"—","var(--ok)")}
          ${mini("Frais prévus",fmt(s.rep),"var(--warn)")}${mini("Prix de vente visé",s.se>0?fmt(s.se):"—","#C084FC")}
        </div>
        <button data-stop class="btn btn-ok btn-full btn-sm" style="margin-top:9px" onclick="event.stopPropagation();S._payId='${p.id}';openModal('payer')">Marquer comme acheté</button>
      </div>`;
    });
    h+=`</div>`;
  }
  if(sorted.length){
    h+=`<div class="hd" style="margin-bottom:9px">En stock — le plus urgent d'abord</div><div class="gauto">`;
    sorted.forEach(p=>h+=cardStock(p));
    h+=`</div>`;
  }
  if(t.paused.length){
    h+=`<div class="hd" style="margin:16px 0 9px">En pause</div><div class="gauto">`;
    t.paused.forEach(p=>h+=cardStock(p,true));
    h+=`</div>`;
  }
  return h;
}
function cardStock(p,dim){
  const s=pStat(p), st=STATUS[p.status], d=dSince(p.entryDate), sc=priorityScore(p), pr=priorityLabel(sc);
  const isD=p.projectType==="depot_vente";
  const reco=!isD&&p.buyPrice>0?Math.round(s.investedTotal*(1+(S.settings.targetMargin||30)/100)/100)*100:0;
  const nextEv=evOfProject(p.id).find(e=>!e.done&&e.date>=today());
  const ratio=s.se>0?s.invested/s.se:0;
  return`<div class="card pad" style="cursor:pointer;${dim?"opacity:.55;":""}border-color:${!dim&&sc>=4?"rgba(244,82,91,.28)":"var(--line)"}" data-p="${p.id}">
    <div class="sp" style="align-items:flex-start;margin-bottom:10px">
      <div style="min-width:0">
        <div class="el" style="font-size:14px;font-weight:700;letter-spacing:-.01em">${esc(pName(p))}</div>
        <div class="el" style="font-size:11px;color:var(--tx3);margin-top:1px">${p.year||""}${p.plate?" · "+esc(p.plate):""}${isD?" · dépôt-vente":""}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
        ${chip(st.label,st.color,st.bg)}
        ${d!==null?`<span class="n" style="font-size:11px;color:${d>(S.settings.maxDays||21)?"var(--bad)":"var(--tx3)"}">${d} j en stock</span>`:""}
      </div>
    </div>
    <div class="g3" style="gap:7px;margin-bottom:9px">
      ${isD
        ?mini("Commission",fmt(s.com),"var(--dep)")+mini("Frais payés",fmt(s.repPaid),"var(--bad)")+mini("Net",fmt(s.profitE),s.profitE>=0?"var(--ok)":"var(--bad)")
        :mini("Investi",fmt(s.invested),"#60A5FA")+mini("Reste à payer",s.repPrev>0?fmt(s.repPrev):"rien","var(--warn)")+mini("Marge estimée",s.se>0?fmt(s.profitE):"—",s.profitE>=0?"var(--ok)":"var(--bad)")}
    </div>
    ${ratio>0?`<div class="bar" style="margin-bottom:8px"><i style="width:${clamp(ratio*100,0,100)}%;background:${ratio>.9?"var(--bad)":ratio>.7?"var(--warn)":"var(--acc)"}"></i></div>`:""}
    <div class="sp" style="gap:8px">
      <span style="font-size:11px;color:var(--tx3)" class="el">${nextEv?`${EVT[nextEv.type]?.icon} ${esc(nextEv.title)} ${relDay(nextEv.date)}`:reco>0?`Prix conseillé ${fmt(reco)}`:"—"}</span>
      ${!dim&&sc>=4?`<span class="chip" style="background:${pr.bg};color:${pr.color}">${pr.label}</span>`:""}
    </div>
  </div>`;
}

    </div>`;

  }
  h+=`</div></div>`;
  h+=`<style>@media(max-width:900px){.det{grid-template-columns:1fr!important}}</style>`;

function vVentes(){
  const sold=S.projects.filter(p=>p.status==="vendu").sort((a,b)=>String(b.exitDate||"").localeCompare(String(a.exitDate||"")));
  const profit=sold.reduce((s,p)=>s+pStat(p).profitR,0);
  const ca=sold.reduce((s,p)=>s+(pStat(p).sr||pStat(p).com),0);
  const withD=sold.filter(p=>p.entryDate&&p.exitDate);
  const avgD=withD.length?Math.round(withD.reduce((s,p)=>s+(dBetween(p.entryDate,p.exitDate)||0),0)/withD.length):0;

  let h=`<div class="g4" style="margin-bottom:14px">
    ${kpi("Chiffre d'affaires",fmt(ca),"#60A5FA",sold.length+" vente"+(sold.length>1?"s":""))}
    ${kpi("Marge totale",fmt(profit),profit>=0?"var(--ok)":"var(--bad)","")}
    ${kpi("Marge moyenne",fmt(sold.length?profit/sold.length:0),"#C084FC","par véhicule")}
    ${kpi("Temps moyen",avgD+" j","var(--warn)","objectif "+(S.settings.maxDays||21)+" j")}
  </div>`;

  if(!sold.length)return h+`<div class="card"><div class="empty"><div class="ei">✓</div>
    <div style="font-size:14px;color:var(--tx2);margin-bottom:5px">Aucune vente enregistrée.</div>
    <div style="font-size:12.5px">Dès qu'un véhicule part, enregistre-le pour suivre ta marge réelle.</div></div></div>`;

  const byM={};
  sold.forEach(p=>{const k=monthKey(p.exitDate)||"?";(byM[k]=byM[k]||[]).push(p);});
  const keys=Object.keys(byM).sort().reverse();
  h+=chartMonths();
  keys.forEach(k=>{
    const list=byM[k], mp=list.reduce((s,p)=>s+pStat(p).profitR,0);
    h+=`<div class="hd" style="margin:16px 0 9px;text-transform:capitalize">${k==="?"?"Sans date":monthLabel(k)}
      <span class="n" style="font-weight:600;font-size:12px;color:${mp>=0?"var(--ok)":"var(--bad)"}">${fmt(mp)} · ${list.length} vente${list.length>1?"s":""}</span></div>`;
    list.forEach(p=>{
      const s=pStat(p), d=dBetween(p.entryDate,p.exitDate), sv=scoreVente(p);
      const pay=p.statutPaiement==="acompte"?["Acompte","var(--warn)"]:p.statutPaiement==="attente"?["Non encaissé","var(--bad)"]:["Encaissé","var(--ok)"];
      h+=`<div class="card pad" style="margin-bottom:9px;cursor:pointer" data-p="${p.id}">
        <div class="sp" style="align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div style="min-width:0;flex:1">
            <div class="el" style="font-size:14px;font-weight:700">${esc(pName(p))} <span class="mut" style="font-weight:400">${p.year||""}</span></div>
            <div class="flex" style="gap:8px;font-size:11px;color:var(--tx3);margin-top:3px;flex-wrap:wrap">
              <span>${p.exitDate?dLabel(p.exitDate):"—"}</span>${d!==null?`<span>${d} j en stock</span>`:""}
              <span style="color:${pay[1]}">${pay[0]}</span>
              <span style="color:${sv.color}">${sv.total}/100</span>
            </div>
          </div>
          <div style="text-align:right">
            <div class="n" style="font-size:19px;font-weight:700;color:${s.profitR>=0?"var(--ok)":"var(--bad)"};letter-spacing:-.02em">${fmtX(s.profitR)}</div>
            <div style="font-size:11px;color:var(--tx3)">${Math.round(s.roi)} % de rentabilité</div>
          </div>
        </div>
        <div class="g4" style="gap:7px;margin-top:10px">
          ${mini("Acheté",fmtX(p.buyPrice||0))}${mini("Frais",fmtX(s.repPaid),"var(--bad)")}
          ${mini("Total investi",fmtX(s.invested),"#60A5FA")}${mini("Vendu",fmtX(s.sr||s.com),"var(--ok)")}
        </div>
      </div>`;
    });
  });
  return h;
}
function chartMonths(){
  const data={};
  S.projects.filter(p=>p.status==="vendu"&&p.exitDate).forEach(p=>{
    const k=monthKey(p.exitDate);data[k]=(data[k]||0)+pStat(p).profitR;});
  const keys=Object.keys(data).sort().slice(-12);
  if(keys.length<2)return"";
  const max=Math.max(...keys.map(k=>Math.abs(data[k])),1);
  return`<div class="card pad">
    <div class="hd">Marge par mois<span class="mut" style="font-weight:400;font-size:11px">12 derniers mois</span></div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
      ${keys.map(k=>{
        const v=data[k], hgt=clamp(Math.abs(v)/max*100,3,100);
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0">
          <div class="n" style="font-size:10px;color:${v>=0?"var(--ok)":"var(--bad)"};white-space:nowrap">${fmt(v)}</div>
          <div style="width:100%;height:${hgt}%;background:${v>=0?"linear-gradient(180deg,var(--ok),rgba(61,214,140,.25))":"linear-gradient(180deg,var(--bad),rgba(244,82,91,.25))"};border-radius:5px 5px 0 0;min-height:4px"></div>
          <div style="font-size:9.5px;color:var(--tx3);white-space:nowrap">${MONTHS[+k.slice(5,7)-1].slice(0,3)}</div>
        </div>`;}).join("")}
    </div>
  </div>`;
}

function vTreso(){
  const tab=S.tab||"vue";
  let h=`<div class="tabs" style="margin-bottom:14px">${[["vue","Vue d'ensemble"],["mouv","Mouvements"],["perso","Dépenses perso"]].map(([k,l])=>
    `<button class="tab${tab===k?" on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>`;
  if(tab==="mouv")return h+tresoMouv();
  if(tab==="perso")return h+tresoPerso();
  return h+tresoVue();
}

  return h;

function vStats(){
  const t=calcTreso();
  const sold=t.sold;
  const invest=S.projects.filter(p=>p.projectType!=="depot_vente"&&p.status!=="annule").reduce((s,p)=>s+(p.buyPrice||0)+pStat(p).repPaid,0);
  const enc=sold.reduce((s,p)=>s+(p.montantEncaisse||p.saleRealPrice||0),0)+sold.filter(p=>p.projectType==="depot_vente").reduce((s,p)=>s+(p.commission||0),0);
  const profit=sold.reduce((s,p)=>s+pStat(p).profitR,0);
  const roi=sold.length?sold.reduce((s,p)=>s+pStat(p).roi,0)/sold.length:0;
  const potA=t.active.reduce((s,p)=>{const x=pStat(p);return x.se>0?s+x.profitE:s;},0);
  const potP=t.prev.reduce((s,p)=>{const x=pStat(p);return x.se>0?s+x.profitE:s;},0);

  let h=`<div class="g4" style="margin-bottom:14px">
    ${kpi("Total investi",fmt(invest),"#60A5FA","achats et frais payés")}
    ${kpi("Total encaissé",fmt(enc),"var(--ok)",sold.length+" vente"+(sold.length>1?"s":""))}
    ${kpi("Marge réalisée",fmt(profit),profit>=0?"var(--ok)":"var(--bad)","")}
    ${kpi("Rentabilité moyenne",roi.toFixed(1)+" %","var(--warn)","")}
  </div>
  <div class="g3" style="margin-bottom:14px">
    ${kpi("Marge en stock",fmt(potA),potA>=0?"var(--ok)":"var(--bad)",t.active.length+" véhicule"+(t.active.length>1?"s":""))}
    ${kpi("Marge prévisionnelle",fmt(potP),"var(--proj)",t.prev.length+" planifié"+(t.prev.length>1?"s":""))}
    ${kpi("Trésorerie finale estimée",fmt(t.tresoReelle+potA+potP-t.fraisPrevus-t.achatsPrev),"#C084FC","tout vendu, tout payé")}
  </div>`;

  h+=chartMonths();

  const scored=sold.map(p=>({p,s:pStat(p),sc:scoreVente(p)})).sort((a,b)=>b.sc.total-a.sc.total);
  if(scored.length){
    h+=`<div class="g2" style="margin-top:14px">
      <div class="card pad"><div class="hd">Tes meilleures opérations</div>
        ${scored.slice(0,5).map(({p,s,sc},i)=>`<div class="ln" data-p="${p.id}" style="cursor:pointer">
          <span class="n" style="width:20px;color:var(--tx3);font-size:12px">${i+1}</span>
          <div style="flex:1;min-width:0"><div class="el" style="font-size:12.5px;font-weight:600">${esc(pName(p))}</div>
          <div style="font-size:11px;color:var(--tx3)">${fmt(s.profitR)} · ${Math.round(s.roi)} % · ${dBetween(p.entryDate,p.exitDate)??"?"} j</div></div>
          <span style="font-size:12px;font-weight:700;color:${sc.color}">${sc.total}</span></div>`).join("")}
      </div>
      <div class="card pad"><div class="hd">Celles à ne pas refaire</div>
        ${scored.slice(-5).reverse().map(({p,s,sc})=>`<div class="ln" data-p="${p.id}" style="cursor:pointer">
          <span style="color:var(--bad);font-size:11px">▾</span>
          <div style="flex:1;min-width:0"><div class="el" style="font-size:12.5px;font-weight:600">${esc(pName(p))}</div>
          <div style="font-size:11px;color:var(--tx3)">${fmt(s.profitR)} · ${dBetween(p.entryDate,p.exitDate)??"?"} j en stock</div></div>
          <span style="font-size:12px;font-weight:700;color:${sc.color}">${sc.total}</span></div>`).join("")}
      </div>
    </div>`;
  }

  /* provenance */
  const orig={};
  sold.forEach(p=>{
    const k=p.originLabel||ORIG[p.originType]?.label||"Non renseignée";
    orig[k]=orig[k]||{n:0,profit:0,icon:ORIG[p.originType]?.icon||"❔",label:k};
    orig[k].n++;orig[k].profit+=pStat(p).profitR;});
  const ol=Object.values(orig).map(o=>({...o,avg:o.profit/o.n})).sort((a,b)=>b.avg-a.avg);
  if(ol.length){
    h+=`<div class="card pad" style="margin-top:14px"><div class="hd">D'où viennent tes meilleures affaires</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px">
      ${ol.map((o,i)=>`<div style="background:var(--raise);border-radius:10px;padding:11px;${i===0&&ol.length>1?"border:1px solid rgba(61,214,140,.3)":""}">
        <div class="flex" style="gap:7px;margin-bottom:6px"><span style="font-size:15px">${o.icon}</span>
        <span class="el" style="font-size:12px;font-weight:600">${esc(o.label)}</span></div>
        <div class="n" style="font-size:17px;font-weight:700;color:${o.avg>=0?"var(--ok)":"var(--bad)"}">${fmtX(o.avg)}</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:2px">de marge moyenne · ${o.n} vente${o.n>1?"s":""}</div>
      </div>`).join("")}</div></div>`;
  }

  /* catégories de frais */
  const spend={};
  S.projects.forEach(p=>(p.expenses||[]).forEach(e=>{
    const c=cat(e.category);spend[c.label]=spend[c.label]||{n:0,total:0,icon:c.icon};
    spend[c.label].total+=+e.amount||0;spend[c.label].n++;}));
  const sl=Object.entries(spend).sort((a,b)=>b[1].total-a[1].total);
  if(sl.length){
    const max=sl[0][1].total;
    h+=`<div class="card pad" style="margin-top:14px"><div class="hd">Où part ton argent<span class="n mut" style="font-size:12px;font-weight:600">${fmt(sl.reduce((s,[,v])=>s+v.total,0))}</span></div>`;
    sl.forEach(([l,v])=>{
      h+=`<div style="margin-bottom:9px">
        <div class="sp" style="margin-bottom:4px;font-size:12px"><span>${v.icon} ${l}<span class="mut" style="font-size:11px"> · ${v.n}</span></span>
        <span class="n" style="color:var(--bad)">${fmt(v.total)}</span></div>
        <div class="bar"><i style="width:${v.total/max*100}%;background:var(--bad)"></i></div></div>`;});
    h+=`</div>`;
  }

  const bd=badges();
  h+=`<div class="card pad" style="margin-top:14px"><div class="hd">Paliers<span class="mut" style="font-weight:400;font-size:11px">${bd.filter(b=>b.ok).length}/${bd.length}</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px">
    ${bd.map(b=>`<div style="display:flex;gap:9px;align-items:center;padding:10px;border-radius:9px;background:${b.ok?"var(--ok-s)":"var(--raise)"};${b.ok?"border:1px solid rgba(61,214,140,.2)":""}">
      <span style="font-size:17px;${b.ok?"":"filter:grayscale(1);opacity:.45"}">${b.icon}</span>
      <div style="min-width:0"><div class="el" style="font-size:12px;font-weight:600;color:${b.ok?"var(--ok)":"var(--tx2)"}">${b.label}</div>
      <div class="el" style="font-size:10.5px;color:var(--tx3)">${b.ok?"obtenu":b.goal}</div></div></div>`).join("")}</div></div>`;
  return h;
}

function setConn(){
  const ok=syncState==="ok";
  const short=SU.replace("https://","").replace(".supabase.co","");
  let h=`<div class="card pad" style="margin-bottom:13px"><div class="hd">Ton compte</div>
    <div class="sp" style="flex-wrap:wrap;gap:10px">
      <div class="flex"><span class="dot" style="background:var(--ok)"></span>
        <div><div style="font-size:13px;font-weight:600">${esc(AUTH.email||"Connecté")}</div>
        <div style="font-size:11.5px;color:var(--tx3)">Connexion par lien e-mail — aucun mot de passe stocké</div></div></div>
      <button class="btn btn-sm" onclick="signOut()">Se déconnecter</button>
    </div></div>

  <div class="card pad" style="margin-bottom:13px">
    <div class="sp" style="flex-wrap:wrap;gap:10px">
      <div class="flex"><span class="dot" style="background:${ok?"var(--ok)":syncState==="loading"?"var(--warn)":"var(--bad)"}"></span>
        <div><div style="font-size:13px;font-weight:600">${ok?"Connecté":syncState==="loading"?"Connexion en cours":"Pas de réponse du serveur"}</div>
        <div class="n" style="font-size:11.5px;color:var(--tx3)">${esc(short)}${connCustom?"":" · projet d'origine"}</div></div></div>
      <div class="wrap">
        <button class="btn btn-p btn-sm" onclick="testConn()">${connBusy?"Test en cours…":"Tester la connexion"}</button>
        ${connCustom?`<button class="btn btn-sm" onclick="resetConn()">Revenir à l'origine</button>`:""}
      </div>
    </div>`;

  if(connDiag){
    h+=`<div class="hr"></div><div class="stack" style="gap:7px">`;
    connDiag.forEach(r=>{
      const lbl=(TABLES.find(t=>t[0]===r.table)||[])[1]||r.table;
      const c=r.lvl==="ok"?"var(--ok)":r.lvl==="warn"?"var(--warn)":"var(--bad)";
      h+=`<div class="flex" style="gap:9px;padding:8px 10px;border-radius:8px;background:var(--raise)">
        <span style="color:${c};font-size:13px">${r.lvl==="ok"?"✓":r.lvl==="warn"?"!":"×"}</span>
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600">${lbl}<span class="n mut" style="font-weight:400"> · ${r.table}</span></div>
        <div class="el" style="font-size:11.5px;color:${c}">${esc(r.msg)}</div></div></div>`;
    });
    h+=`</div>`;
    const fixes=new Set(connDiag.filter(r=>r.lvl!=="ok").map(r=>r.fix));
    if(fixes.size){
      h+=`<div style="margin-top:11px;padding:11px 13px;border-radius:9px;background:var(--warn-s);border:1px solid rgba(245,165,36,.25);font-size:12.5px;color:var(--tx2);line-height:1.55">`;
      if(fixes.has("url"))h+=`<div><b>L'adresse ne répond pas.</b> Vérifie qu'elle est de la forme https://xxxx.supabase.co, sans barre oblique à la fin, et que le projet n'est pas en pause dans Supabase.</div>`;
      if(fixes.has("key"))h+=`<div><b>La clé est refusée.</b> Reprends celle marquée « anon » ou « publishable » dans Project Settings → API. Surtout pas la clé service_role.</div>`;
      if(fixes.has("sql"))h+=`<div><b>Il manque des tables ou des règles d'accès.</b> Colle le script ci-dessous dans l'éditeur SQL de Supabase et clique sur Run. Il peut être relancé sans risque.</div>`;
      h+=`</div>`;
    }else{
      h+=`<div style="margin-top:11px;padding:11px 13px;border-radius:9px;background:var(--ok-s);border:1px solid rgba(61,214,140,.25);font-size:12.5px;color:var(--tx2)">Tout répond. Tes données circulent dans les deux sens sur ce projet.</div>`;
    }
  }
  h+=`</div>`;

  h+=`<div class="card pad" style="margin-bottom:13px"><div class="hd">Changer de projet Supabase</div>
    <div style="font-size:12.5px;color:var(--tx2);line-height:1.55;margin-bottom:11px">Ces deux valeurs se trouvent dans ton tableau de bord Supabase, sous <b>Project Settings → API</b> (<a href="${apiURL()}" target="_blank" rel="noopener">ouvrir la page</a>). Le nouveau projet sera vide : télécharge une sauvegarde depuis l'onglet Données <i>avant</i> de changer, puis restaure-la ensuite.</div>
    <div style="margin-bottom:10px"><label class="lbl">Adresse du projet (Project URL)</label>
      <input id="cn-url" value="${esc(SU)}" placeholder="https://xxxxxxxx.supabase.co" style="font-family:var(--mono);font-size:12px"></div>
    <div style="margin-bottom:11px"><label class="lbl">Clé publique (anon / publishable)</label>
      <input id="cn-key" value="${esc(SK)}" placeholder="eyJ… ou sb_publishable_…" style="font-family:var(--mono);font-size:12px"></div>
    <div class="wrap">
      <button class="btn btn-p btn-sm" onclick="saveConn()">Enregistrer et recharger</button>
      <button class="btn btn-sm" onclick="testConn()">Tester sans enregistrer</button>
      <button class="btn btn-sm" onclick="exportJSON()">Sauvegarder d'abord</button>
    </div>
    <div style="font-size:11.5px;color:var(--tx3);margin-top:9px;line-height:1.55">La clé publique est faite pour vivre dans une page web, mais avec les règles d'accès créées par le script, <b>toute personne qui obtient ce fichier peut lire et modifier tes données</b>. Garde-le pour toi et ne le publie pas en ligne. La clé service_role, elle, ne doit jamais sortir de ton tableau de bord.</div>
  </div>`;

  h+=`<div class="card pad"><div class="hd">Mise en place, une seule fois
      <span class="wrap"><button class="btn btn-xs" onclick="copySQL()">Copier le script</button>
      <a class="btn btn-xs" href="${sqlURL()}" target="_blank" rel="noopener">Ouvrir l'éditeur SQL</a></span></div>
    <ol style="padding-left:19px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--tx2);line-height:1.55;margin-bottom:11px">
      <li>Clique sur <b>Copier le script</b>, puis sur <b>Ouvrir l'éditeur SQL</b> (connecte-toi à Supabase si besoin).</li>
      <li>Colle le script dans la fenêtre, puis clique sur <b>Run</b> en bas à droite.</li>
      <li>Reviens ici et clique sur <b>Tester la connexion</b> : les cinq lignes doivent passer au vert.</li>
    </ol>
    <div style="font-size:11.5px;color:var(--tx3);margin-bottom:10px">Le script peut être relancé autant de fois que nécessaire, il ne détruit aucune donnée.</div>
    <pre class="n" style="padding:12px;background:var(--raise);border-radius:9px;font-size:11px;color:var(--tx2);overflow-x:auto;white-space:pre;line-height:1.5;margin:0">${esc(SQL_SETUP)}</pre>
  </div>`;
  return h;
}

function setType(t){
  g("n-type").value=t;
  g("tt-a").classList.toggle("on",t==="achat");

}
function pickOrig(k){
  g("og-type").value=k;
  Object.keys(ORIG).forEach(x=>{
    const b=g("og-"+x);if(!b)return;
    b.style.cssText="flex-direction:column;padding:12px 6px;text-align:center;"+(x===k?"background:var(--acc-s);color:#B9C6FF;border:1px solid var(--acc)":"");});
  const subs=ORIG[k]?.subs||[];
  g("og-sub").style.display=subs.length?"block":"none";
  if(subs.length)g("og-subv").innerHTML=subs.map(s=>`<option>${s}</option>`).join("");
}
function pickEvType(k){
  g("e-type").value=k;
  Object.keys(EVT).forEach(x=>{const b=g("et-"+x);if(!b)return;
    b.style.cssText="justify-content:flex-start;"+(x===k?"background:var(--acc-s);color:#B9C6FF;border:1px solid var(--acc)":"");});

}
