function submitNew(){
  const brand=gv("n-brand").trim(), model=gv("n-model").trim();
  if(!brand&&!model)return showToast("Indique au moins la marque ou le modèle","err");
  const t=gv("n-type");
  S.projects=[{id:uid(),projectType:t,brand,model,
    year:parseInt(gv("n-year"))||new Date().getFullYear(),
    plate:gv("n-plate").trim(),vin:gv("n-vin").trim(),km:gn("n-km"),
    buyPrice:t==="achat"?gn("n-buy"):0,saleEstPrice:gn("n-est"),saleRealPrice:0,
    commission:gn("n-com"),ownerPrice:gn("n-own"),
    status:gv("n-status")||"acquisition",entryDate:gv("n-entry")||today(),
    expenses:[],timeEntries:[]},...S.projects];
  save();closeModal();selectProject(S.projects[0].id);
  showToast(`${brand} ${model} ajouté`);
}
function submitEdit(){
  const p=proj(S.selected);if(!p)return;
  upd(p.id,{brand:gv("e-brand").trim(),model:gv("e-model").trim(),
    year:parseInt(gv("e-year"))||p.year,plate:gv("e-plate").trim(),vin:gv("e-vin").trim(),km:gn("e-km"),
    ...(p.projectType==="depot_vente"?{commission:gn("e-com"),ownerPrice:gn("e-own")}:{buyPrice:gn("e-buy"),saleEstPrice:gn("e-est")}),
    entryDate:gv("e-entry")||p.entryDate,exitDate:gv("e-exit")||"",status:gv("e-status")||p.status});
  showToast("Modifications enregistrées");
}
function submitExpense(){
  const p=proj(S.selected);if(!p)return;
  const a=gn("x-amt"), l=gv("x-lbl").trim();
  if(!a)return showToast("Indique le montant","err");
  if(!l)return showToast("Indique ce que c'est","err");
  const date=gv("x-date")||today(), paid=gc("x-paid"), who=gv("x-who").trim();
  upd(p.id,{expenses:[...(p.expenses||[]),{id:uid(),amount:a,label:l,category:gv("x-cat")||"autre",bodyshop:who,date,paid}]},true);
  if(gc("x-plan")){
    addEvent({title:l,type:"atelier",date,projectId:p.id,place:who,notes:fmt(a)});
  }
  closeModal();render();
  showToast(paid?"Dépense enregistrée":"Dépense à venir enregistrée");
}
function submitSell(){
  const id=S._saleId||S.selected, p=proj(id);if(!p)return;
  const prix=gn("v-price");
  if(!prix)return showToast("Indique le prix de vente réel","err");
  const enc=gn("v-enc")||prix;
  upd(id,{status:"vendu",saleRealPrice:prix,exitDate:gv("v-date")||today(),
    montantEncaisse:enc,statutPaiement:gv("v-stat")||"paye",buyer:gv("v-buyer").trim()});
  S._saleId=null;
  const m=pStat(proj(id)).profitR;
  showToast(`Vendu à ${fmtX(prix)} — ${m>=0?"marge":"perte"} ${fmtX(Math.abs(m))}`);
}
function submitCommission(){
  const p=proj(S.selected);if(!p)return;
  const real=gn("c-real");
  upd(p.id,{commission:gn("c-com"),ownerPrice:gn("c-own"),listingPrice:gn("c-list"),
    saleRealPrice:real,...(real>0?{status:"vendu",exitDate:p.exitDate||today()}:{})});
  showToast("Enregistré");
}
function submitTime(){
  const p=proj(S.selected);if(!p)return;
  const h=gn("t-h"), l=gv("t-lbl").trim();
  if(!h||!l)return showToast("Indique la durée et ce que tu as fait","err");
  upd(p.id,{timeEntries:[...(p.timeEntries||[]),{id:uid(),hours:h,label:l,date:gv("t-date")||today()}]});
  showToast("Temps enregistré");
}
function submitFiche(){
  const p=proj(S.selected);if(!p)return;
  upd(p.id,{nbOwners:parseInt(gv("f-own"))||0,histovec:gv("f-hist"),ctValid:gv("f-ct"),ctDate:gv("f-ctdate"),
    mec_dist:gv("f-dist"),mec_emb:gv("f-emb"),mec_pneu:gv("f-pneu"),defauts:gv("f-def").trim()});
  showToast("Fiche enregistrée");
}
function submitOrigin(){
  const p=proj(S.selected);if(!p)return;
  const sub=gv("og-subv");
  upd(p.id,{originType:gv("og-type"),originSub:sub,originLabel:gv("og-lbl").trim()||sub,originNotes:gv("og-notes").trim()});
  showToast("Provenance enregistrée");
}
function submitInjection(){
  const a=gn("j-amt");
  if(!a)return showToast("Indique le montant","err");
  S.caps=[...S.caps,{id:uid(),amount:a,note:gv("j-note").trim(),date:gv("j-date")||today()}];
  save();closeModal();render();showToast("Apport de "+fmtX(a)+" enregistré");
}
function submitPayer(){
  const id=S._payId, m=gn("y-amt");
  if(!m)return showToast("Indique le montant payé","err");
  upd(id,{status:"acquisition",buyPrice:m,entryDate:gv("y-date")||today(),
    paiementAchat:{montant:m,date:gv("y-date")||today(),moyen:gv("y-moyen")}});
  S._payId=null;showToast("Acheté à "+fmtX(m));
}
function addEvent(o){
  const e={id:uid(),src:"local",done:false,duration:60,time:"",place:"",notes:"",contact:"",phone:"",
    gcalId:null,_dirty:true,createdAt:new Date().toISOString(),...o};
  S.events=[...S.events,e];
  return e;
}
function submitEvent(id){
  const title=gv("e-title").trim()||EVT[gv("e-type")]?.label||"Rendez-vous";
  const data={title,type:gv("e-type")||"rdv",date:gv("e-date")||today(),time:gv("e-time"),
    duration:parseInt(gv("e-dur"))||60,projectId:gv("e-proj")||null,
    contact:gv("e-contact").trim(),phone:gv("e-phone").trim(),
    place:gv("e-place").trim(),notes:gv("e-notes").trim(),
    noSync:gcalReady()?!gc("e-sync"):false,_dirty:true};
  if(id){
    const e=S.events.find(x=>x.id===id);
    if(e)Object.assign(e,data);
  }else addEvent(data);
  save();closeModal();
  if(S.view!=="agenda"&&S.view!=="detail"&&S.view!=="today")S.view="agenda";
  render();
  showToast(id?"Rendez-vous modifié":`Planifié ${relDay(data.date)}${data.time?" à "+data.time:""}`);
  if(gcalReady()&&gcalConnected()&&S.settings.gcalAuto)gcalSync(true);
}
function toggleEvent(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  e.done=!e.done;e._dirty=true;save();render();
  showToast(e.done?"Fait ✓":"Rouvert");
}
function delEvent(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  gcalDelete(e);
  if(e.src!=="gcal")dbDelete("events",id);
  S.events=S.events.filter(x=>x.id!==id);
  save();closeModal();render();showToast("Rendez-vous supprimé");
}
function dlOne(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  dl(new Blob([buildICS([e])],{type:"text/calendar"}),"rdv.ics");
}
function upd(id,fields,quiet){
  S.projects=S.projects.map(p=>p.id===id?{...p,...fields}:p);
  save();
  if(!quiet){closeModal();render();}
}
function setStatus(id,st){
  if(st==="vendu"){S._saleId=id;return openModal("sell");}
  S.projects=S.projects.map(p=>p.id===id?{...p,status:st}:p);
  save();render();showToast("→ "+STATUS[st].label);
}
function delProject(id){
  const p=proj(id);
  if(!confirm(`Supprimer ${pName(p)} et tout son historique ?`))return;
  dbDelete("projects",id);
  S.projects=S.projects.filter(x=>x.id!==id);
  S.events.filter(e=>e.projectId===id).forEach(e=>{e.projectId=null;e._dirty=true;});
  S.selected=null;S.view="stock";save();render();showToast("Supprimé");
}
function delExpense(pid,eid){
  const p=proj(pid);if(!p)return;
  upd(pid,{expenses:(p.expenses||[]).filter(e=>e.id!==eid)},true);renderContent();showToast("Supprimé");
}
function togglePaid(pid,eid){
  const p=proj(pid);if(!p)return;
  upd(pid,{expenses:(p.expenses||[]).map(e=>e.id===eid?{...e,paid:e.paid===false}:e)},true);renderContent();
}
function saveQualite(pid,v){upd(pid,{scoreQualite:v},true);renderContent();}
function delPerso(id){S.perso=S.perso.filter(e=>e.id!==id);dbDelete("perso_expenses",id);save();renderContent();showToast("Supprimé");}
function delCap(id){S.caps=S.caps.filter(c=>c.id!==id);dbDelete("capital_injections",id);save();renderContent();showToast("Supprimé");}
function addPerso(){
  const a=parseFloat(gv("pa")), l=gv("pl").trim();
  if(!a||!l)return showToast("Indique le montant et ce que c'est","err");
  S.perso=[{id:uid(),amount:a,label:l,category:gv("pc")||"autre_p",date:gv("pd")||today()},...S.perso];
  save();renderContent();showToast("Ajouté");
}
function saveBase(){S.settings.tresoManuelle=parseFloat(gv("tbase"))||0;save();renderContent();showToast("Solde mis à jour");}
function saveSetting(k,v){S.settings[k]=parseFloat(v)||0;save();}
function saveGoogle(){
  S.settings.gcalClientId=gv("gcid").trim();
  S.settings.gcalCalendarId=gv("gcal").trim()||"primary";
  save();render();
  showToast(gcalReady()?"Enregistré — tu peux te connecter":"Identifiant effacé");
}
function addCat(perso){
  const i=gv(perso?"npi":"nci")||"📦", l=gv(perso?"npl":"ncl").trim();
  if(!l)return showToast("Donne un nom à la catégorie","err");
  const k=perso?"customPersoCats":"customCats";
  S.settings[k]=[...(S.settings[k]||[]),{id:uid(),label:l,icon:i}];
  save();renderContent();showToast("Catégorie ajoutée");
}
function delCat(id,perso){
  const k=perso?"customPersoCats":"customCats";
  S.settings[k]=(S.settings[k]||[]).filter(c=>c.id!==id);
  save();renderContent();
}
function toggleNotifs(){
  if(S.settings.notifs){S.settings.notifs=false;save();renderContent();return;}
  if(!("Notification"in window))return showToast("Ton navigateur ne gère pas les notifications","err");
  Notification.requestPermission().then(p=>{
    S.settings.notifs=p==="granted";save();renderContent();
    showToast(S.settings.notifs?"Rappels activés":"Autorisation refusée",S.settings.notifs?"ok":"err");
    if(S.settings.notifs)morningPing();
  });
}
function morningPing(){
  if(!S.settings.notifs||!("Notification"in window)||Notification.permission!=="granted")return;
  const n=evOn(today()).filter(e=>!e.done), late=evOpenPast().length;
  if(!n.length&&!late)return;
  const body=n.length?n.slice(0,3).map(e=>(e.time?e.time+" ":"")+e.title).join("\n"):`${late} rendez-vous en retard`;
  try{new Notification(`${n.length} rendez-vous aujourd'hui`,{body,tag:"gb-day"});}catch{}
}
function exportJSON(){
  dl(new Blob([JSON.stringify({projects:S.projects,perso:S.perso,caps:S.caps,events:S.events,settings:S.settings,meta:S.meta},null,2)],{type:"application/json"}),
    "garagebudget-"+today()+".json");
  showToast("Sauvegarde téléchargée");
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const d=JSON.parse(e.target.result);
    if(!d.projects)throw 0;
    S.projects=d.projects;
    S.perso=d.perso||[];S.caps=d.caps||[];S.events=d.events||[];
    if(d.settings)S.settings={...S.settings,...d.settings};
    if(d.meta)S.meta={...S.meta,...d.meta};
    save();render();showToast("Sauvegarde restaurée");
  }catch{showToast("Ce fichier n'est pas une sauvegarde GarageBudget","err");}};
  r.readAsText(f);ev.target.value="";
}
function wipeLocal(){
  if(!confirm("Vider les données de cet appareil ?"))return;
  localStorage.removeItem(LS);localStorage.removeItem("gbv8");localStorage.removeItem("gbv8s");
  showToast("Cache vidé");setTimeout(()=>location.reload(),700);
}

/* ══════════════════════════════════════════════════════════════
   21. RECHERCHE RAPIDE
   ══════════════════════════════════════════════════════════════ */
let palIdx=0, palItems=[];
function openPal(){
  g("pal").classList.add("on");
  const i=g("pal-in");i.value="";i.focus();palFill("");
}
function closePal(){g("pal").classList.remove("on");}
function palFill(q){
  q=q.toLowerCase().trim();
  const items=[];
  NAV.forEach(([v,ic,l])=>items.push({icon:ic,label:l,sub:"Aller à",fn:()=>setView(v)}));
  items.push({icon:"＋",label:"Nouveau véhicule",sub:"Créer",fn:()=>openModal("new")});
  items.push({icon:"📅",label:"Nouveau rendez-vous",sub:"Créer",fn:()=>openModal("event")});
  items.push({icon:"💉",label:"Apport de fonds",sub:"Créer",fn:()=>openModal("injection")});
  items.push({icon:"⬇",label:"Télécharger une sauvegarde",sub:"Données",fn:()=>exportJSON()});
  items.push({icon:"📆",label:"Exporter l'agenda (.ics)",sub:"Données",fn:()=>exportICS()});
  S.projects.forEach(p=>items.push({icon:"🚗",label:pName(p),
    sub:`${STATUS[p.status]?.label}${p.plate?" · "+p.plate:""}${p.year?" · "+p.year:""}`,fn:()=>selectProject(p.id)}));
  S.events.filter(e=>e.date>=addDays(today(),-30)).forEach(e=>items.push({icon:EVT[e.type]?.icon||"📌",
    label:e.title,sub:"Rendez-vous · "+relDay(e.date),fn:()=>{S.anchor=e.date;S.agendaMode="jour";setView("agenda");}}));
  palItems=q?items.filter(i=>(i.label+" "+i.sub).toLowerCase().includes(q)).slice(0,24):items.slice(0,14);
  palIdx=0;palRender();
}
function palRender(){
  g("pal-res").innerHTML=palItems.length?palItems.map((i,n)=>
    `<div class="pal-i${n===palIdx?" on":""}" onclick="palGo(${n})">
      <span style="width:20px;text-align:center">${i.icon}</span>
      <div style="flex:1;min-width:0"><div class="el">${esc(i.label)}</div>
      <div class="el" style="font-size:11px;color:var(--tx3)">${esc(i.sub)}</div></div></div>`).join("")
    :`<div style="padding:22px;text-align:center;color:var(--tx3);font-size:12.5px">Rien trouvé.</div>`;
}
function palGo(n){const it=palItems[n];if(!it)return;closePal();it.fn();}

/* ══════════════════════════════════════════════════════════════
   22. CLAVIER & DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();return g("pal").classList.contains("on")?closePal():openPal();}
  if(g("pal").classList.contains("on")){
    if(e.key==="Escape")return closePal();
    if(e.key==="ArrowDown"){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);return palRender();}
    if(e.key==="ArrowUp"){e.preventDefault();palIdx=Math.max(palIdx-1,0);return palRender();}
    if(e.key==="Enter"){e.preventDefault();return palGo(palIdx);}
    return;
  }
  if(e.key==="Escape")return closeModal();
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(g("modal-root").innerHTML)return;
  const k=e.key.toLowerCase();
  if(k==="n")return openModal("new");
  if(k==="r")return openModal("event");
  if(k==="a")return setView("agenda");
  if(k==="s")return setView("stock");
  if(k==="t")return setView("today");
});
g("pal-in").addEventListener("input",e=>palFill(e.target.value));
window.addEventListener("resize",()=>{renderTop();});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    streakTick();
    if(!S._dirty&&!syncTimer)pullRemote().then(ok=>{if(ok)render();});
    if(S.settings.gcalAuto&&gcalConnected())gcalSync(true);
  }
});
/* Fermeture de l'onglet : on force un dernier envoi qui survit à la page. */
function flushOnExit(){
  if(!S._dirty)return;
  const body=[["settings",[{id:"main",data:S.settings,updated_at:new Date().toISOString()}]],
    ["projects",S.projects.map(p=>({id:p.id,data:p,updated_at:new Date().toISOString()}))],
    ["perso_expenses",S.perso.map(e=>({id:e.id,data:e}))],
    ["capital_injections",S.caps.map(c=>({id:c.id,data:c}))],
    ["events",S.events.filter(e=>e.src!=="gcal").map(e=>({id:e.id,data:e,updated_at:new Date().toISOString()}))]];
  body.forEach(([t,rows])=>{
    if(!rows.length)return;
    try{
      if(authed())fetch(SU+"/rest/v1/"+t,{method:"POST",keepalive:true,
        headers:{...SH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(rows)});
    }catch{}
  });
}
window.addEventListener("pagehide",flushOnExit);
window.addEventListener("beforeunload",flushOnExit);

async function boot(){
  let hash=null;
  try{hash=captureHash();}catch{hash=null;}
  authLoad();
  if(hash&&hash.err)return showGate(hash.err==="otp_expired"
    ?"Ce lien a expiré. Demande-en un nouveau." : hash.err,"err");
  const ok=(hash&&hash.ok)||await authReady();
  if(!ok)return showGate(AUTH.email?"Ta session a expiré. Redemande un lien.":"");
  showApp();
  if(!AUTH.email||!AUTH.id)fetchUser();
  await loadAll();
  setTimeout(morningPing,1200);
}
boot().catch(()=>showGate("Démarrage impossible. Recharge la page.","err"));
</script>
